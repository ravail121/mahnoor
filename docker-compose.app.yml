# The app container. Run together with docker-compose.yml (and
# docker-compose.proxy.yml, if using HTTPS via Caddy) as one stack — see the
# header comment in docker-compose.yml for the combined command.
#
# No public port here by default — Caddy (docker-compose.proxy.yml) owns
# 80/443 and reaches this container over the internal Docker network by
# service name. Set APP_PORT if you want to expose it directly instead
# (e.g. no domain/HTTPS yet) — bound to localhost only; use an SSH tunnel or
# a security-group rule to reach it from outside.
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container "127.0.0.1" would mean the container itself, so
      # override the host-dev DATABASE_URL/DIRECT_URL from .env to reach
      # Postgres by its Docker service name instead. Everything else (AUTH_URL,
      # AUTH_SECRET, etc.) still comes from .env as-is — set AUTH_URL there to
      # this server's real public URL for production.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@clinic_postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@clinic_postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
