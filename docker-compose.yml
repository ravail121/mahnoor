# PostgreSQL + Adminer — used for both local dev and self-hosted production
# (e.g. EC2). App compose lives in docker-compose.app.yml.
#
# Run together as one stack (required for the app to reach `clinic_postgres`
# by name, and for depends_on/healthcheck ordering to work):
#   docker compose -p clinic -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# Adminer is bound to 127.0.0.1 only — reach it via an SSH tunnel:
#   ssh -L 8080:localhost:8080 <user>@<host>
# then open http://localhost:8080 on your own machine.

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer:4
    container_name: clinic_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  clinic_postgres_data:
